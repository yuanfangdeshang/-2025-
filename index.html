<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>微信聊天年度报告生成器</title>
<style>
:root{--bg:#0a0a0f;--c1:#141420;--me:#a78bfa;--me2:#c4b5fd;--them:#ff6b4a;--them2:#ff8a70;--t:#f8f8f2;--t2:#a1a1aa;--gold:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--t);font-size:18px;line-height:1.6}

/* 文件选择界面 */
#upload{position:fixed;inset:0;background:var(--bg);z-index:1001;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#upload.hide{display:none}
#upload h1{font-size:clamp(32px,8vw,48px);font-weight:800;background:linear-gradient(135deg,var(--me),var(--them));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
#upload .sub{color:var(--t2);font-size:16px;margin-bottom:40px}
#upload .sub a{color:var(--me)}
.file-box{border:2px dashed rgba(255,255,255,.2);border-radius:20px;padding:60px 40px;cursor:pointer;transition:all .3s;max-width:500px;width:90%}
.file-box:hover{border-color:var(--me);background:rgba(167,139,250,.05)}
.file-box input{display:none}
.file-box .icon{font-size:48px;margin-bottom:16px}
.file-box .txt{font-size:18px;color:var(--t2)}
.file-box .hint{font-size:14px;color:var(--t2);opacity:.6;margin-top:12px}
#upload .loading{display:none;margin-top:30px}
#upload .loading.show{display:block}
#upload .loading .spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,.1);border-top-color:var(--me);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 视角选择 */
#perspective{position:fixed;inset:0;background:var(--bg);z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#perspective.show{display:flex}
#perspective h2{font-size:clamp(24px,6vw,36px);margin-bottom:30px}
#perspective .options{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
#perspective .opt{padding:20px 40px;background:var(--c1);border:2px solid transparent;border-radius:16px;cursor:pointer;transition:all .3s;min-width:150px}
#perspective .opt:hover{border-color:var(--me);transform:translateY(-2px)}
#perspective .opt .name{font-size:20px;font-weight:600;margin-bottom:4px}
#perspective .opt .count{font-size:14px;color:var(--t2)}
#perspective .opt.me .name{color:var(--me)}
#perspective .opt.them .name{color:var(--them)}

/* 开始界面 */
#intro{position:fixed;inset:0;background:var(--bg);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity .8s}
#intro.show{display:flex}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{font-size:clamp(42px,12vw,72px);font-weight:800;background:linear-gradient(135deg,var(--me),var(--them));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#intro .names{font-size:clamp(24px,6vw,36px);color:var(--t2);margin:20px 0 50px}
#intro .names .me{color:var(--me)}
#intro .names .them{color:var(--them)}
#intro button{padding:20px 60px;font-size:clamp(18px,5vw,24px);font-weight:600;background:linear-gradient(135deg,var(--me),var(--them));border:none;border-radius:40px;color:#fff;cursor:pointer;transition:transform .2s}
#intro button:hover{transform:scale(1.05)}

/* 动画层 */
#anim{position:fixed;inset:0;background:var(--bg);z-index:998;display:none;overflow:hidden}
#anim.on{display:block}
#anim.out{animation:fadeOut 1.5s forwards}
@keyframes fadeOut{to{opacity:0}}
#ac{position:absolute;inset:0}
#prog{position:fixed;bottom:0;left:0;height:4px;background:linear-gradient(90deg,var(--me),var(--them));width:0;z-index:1002}

.cmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;opacity:0;pointer-events:none;padding:16px 32px;border-radius:20px;max-width:80vw}
.cmsg.me{background:linear-gradient(135deg,var(--me),#818cf8)}
.cmsg.them{background:linear-gradient(135deg,var(--them),var(--them2))}
.cmsg .dt{font-size:12px;opacity:.7;margin-bottom:6px}
.cmsg .txt{font-weight:600;line-height:1.4}
.cmsg.show{animation:cIn .5s ease forwards}
.cmsg.hide{animation:cOut .6s ease forwards}
@keyframes cIn{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes cOut{to{opacity:0;transform:translate(-50%,-50%) scale(.85);filter:blur(8px)}}

.fmsg{position:absolute;padding:10px 20px;border-radius:16px;opacity:0;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw;transform:translate(-50%,-50%);font-weight:500}
.fmsg.me{background:linear-gradient(135deg,var(--me),#818cf8)}
.fmsg.them{background:linear-gradient(135deg,var(--them),var(--them2))}
.fmsg.show{animation:fIn .35s ease forwards}
@keyframes fIn{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}

/* 报告主体 */
#report{display:none;position:fixed;inset:0;overflow:hidden}
#report.on{display:block}
#pgwrap{position:absolute;inset:0;transition:transform .5s cubic-bezier(.4,0,.2,1)}

.pg{position:absolute;left:0;right:0;height:100%;display:flex;flex-direction:column;padding:clamp(20px,5vw,50px);padding-bottom:80px;overflow-y:auto;-webkit-overflow-scrolling:touch}

.phd{margin-bottom:20px;opacity:0;transform:translateY(30px)}
.phd.ani{animation:slideUp .5s ease forwards}
.pn{font-size:12px;color:var(--me);letter-spacing:3px;margin-bottom:6px;font-weight:600}
.pt{font-size:clamp(26px,7vw,42px);font-weight:700;line-height:1.2;background:linear-gradient(135deg,var(--t) 30%,var(--t2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ps{font-size:clamp(14px,3.5vw,18px);color:var(--t2);margin-top:8px}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.hero{text-align:center;margin:20px 0;opacity:0;transform:translateY(30px)}
.hero.ani{animation:slideUp .6s ease forwards}
.hero .n{font-size:clamp(60px,20vw,110px);font-weight:900;background:linear-gradient(135deg,var(--me),var(--them));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero .l{font-size:clamp(16px,4vw,22px);color:var(--t2)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:clamp(10px,2.5vw,16px);margin:16px 0}
.card{background:var(--c1);border-radius:16px;padding:clamp(16px,4vw,24px);text-align:center;opacity:0;transform:scale(.9)}
.card.ani{animation:cardIn .5s ease forwards}
@keyframes cardIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.card .v{font-size:clamp(28px,8vw,44px);font-weight:700}
.card .v.me{color:var(--me)}.card .v.them{color:var(--them)}.card .v.g{color:var(--gold)}
.card .l{font-size:clamp(12px,3vw,15px);color:var(--t2);margin-top:4px}
.card.me-bg{background:linear-gradient(135deg,var(--me),#818cf8)}
.card.them-bg{background:linear-gradient(135deg,var(--them),var(--them2))}
.card.me-bg .v,.card.them-bg .v{color:#fff}
.card.me-bg .l,.card.them-bg .l{color:rgba(255,255,255,.8)}

.bar-row{display:flex;align-items:center;gap:12px;margin:12px 0;opacity:0;transform:translateX(-20px)}
.bar-row.ani{animation:barIn .5s ease forwards}
@keyframes barIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
.bar-label{width:80px;font-size:15px;color:var(--t2);flex-shrink:0}
.bar-wrap{flex:1;height:36px;background:var(--c1);border-radius:18px;overflow:hidden}
.bar-fill{height:100%;border-radius:18px;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;font-weight:700;font-size:20px;color:#fff;min-width:70px}
.bar-fill.me{background:linear-gradient(90deg,var(--me),var(--me2))}
.bar-fill.them{background:linear-gradient(90deg,var(--them),var(--them2))}

.insight{background:linear-gradient(135deg,rgba(167,139,250,.1),rgba(255,107,74,.05));border-left:4px solid var(--me);border-radius:0 12px 12px 0;padding:clamp(14px,3vw,20px);margin:16px 0;opacity:0;transform:translateY(20px)}
.insight.ani{animation:slideUp .5s ease forwards}
.insight-title{font-weight:600;margin-bottom:6px;color:var(--me)}
.insight-text{font-size:15px;color:var(--t2);line-height:1.6}

.quote{background:var(--c1);border-radius:16px;padding:clamp(16px,4vw,24px);margin:12px 0;opacity:0;transform:translateY(20px)}
.quote.ani{animation:slideUp .5s ease forwards}
.quote-text{font-size:clamp(16px,4vw,20px);font-style:italic;margin-bottom:10px}
.quote-meta{font-size:13px;color:var(--t2)}

.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.end .ti{font-size:clamp(36px,10vw,60px);font-weight:800;background:linear-gradient(135deg,var(--me),var(--them));-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:0}
.end .ti.ani{animation:slideUp .6s ease forwards}
.end .st{font-size:clamp(14px,3.5vw,20px);color:var(--t2);margin-top:16px;opacity:0}
.end .st.ani{animation:slideUp .6s ease .2s forwards}
.end .msg{font-size:clamp(18px,5vw,26px);margin-top:30px;opacity:0}
.end .msg.ani{animation:slideUp .6s ease .4s forwards}

.dots{position:fixed;right:clamp(10px,2vw,18px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:100}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .3s}
.dot:hover{background:rgba(255,255,255,.4)}.dot.act{background:var(--me);transform:scale(1.3)}

.hint{position:fixed;bottom:clamp(14px,3vw,24px);left:50%;transform:translateX(-50%);color:var(--t2);font-size:14px;opacity:.6;transition:all .3s}
.hint.ready{color:var(--gold);opacity:1}

#mute-btn{position:fixed;top:16px;right:16px;z-index:1003;background:rgba(255,255,255,.1);border:none;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;transition:all .3s;display:none}
#mute-btn.show{display:block}
#mute-btn:hover{background:rgba(255,255,255,.2)}
</style>
</head>
<body>

<!-- 文件上传界面 -->
<div id="upload">
<h1>微信聊天年度报告</h1>
<div class="sub">选择由 <a href="https://github.com/LC044/WeChatMsg" target="_blank">留痕/WeChatMsg</a> 导出的JSON文件</div>
<label class="file-box">
<input type="file" id="fileInput" accept=".json">
<div class="icon">📁</div>
<div class="txt">点击选择 JSON 文件</div>
<div class="hint">支持私聊导出的聊天记录</div>
</label>
<div class="loading" id="loading">
<div class="spinner"></div>
<div>正在分析聊天记录...</div>
</div>
</div>

<!-- 视角选择 -->
<div id="perspective">
<h2>选择你的视角</h2>
<div class="options" id="perspectiveOptions"></div>
</div>

<!-- 开始界面 -->
<div id="intro">
<h1 id="introYear">2025</h1>
<div class="names"><span class="me" id="introMe"></span> → <span class="them" id="introThem"></span></div>
<button onclick="startAnim()">开始回顾 ✨</button>
</div>

<!-- 动画层 -->
<div id="anim"><div id="ac"></div><div id="prog"></div></div>

<!-- 报告主体 -->
<div id="report">
<div id="pgwrap"></div>
<div class="dots" id="dots"></div>
<div class="hint" id="hint">滚动翻页 ↓</div>
</div>

<!-- 音乐控制 -->
<button id="mute-btn" onclick="toggleMute()">🔊</button>
<audio id="bgm" loop preload="auto"><source src="bgm.mp3" type="audio/mpeg"></audio>

<script>
// 全局数据
let rawData = null;
let stats = null;
let myName = '';
let themName = '';
let animMsgs = [];
let isMuted = false;

// DOM
const uploadEl = document.getElementById('upload');
const perspectiveEl = document.getElementById('perspective');
const introEl = document.getElementById('intro');
const animEl = document.getElementById('anim');
const ac = document.getElementById('ac');
const prog = document.getElementById('prog');
const reportEl = document.getElementById('report');
const pgwrap = document.getElementById('pgwrap');
const dotsEl = document.getElementById('dots');
const hint = document.getElementById('hint');
const bgm = document.getElementById('bgm');
const muteBtn = document.getElementById('mute-btn');

let pgs, dots, total = 0, cur = 1, busy = false, readyToFlip = false;

// 文件选择
document.getElementById('fileInput').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    
    document.getElementById('loading').classList.add('show');
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            rawData = JSON.parse(e.target.result);
            analyzeData();
            showPerspective();
        } catch (err) {
            alert('JSON解析失败: ' + err.message);
            document.getElementById('loading').classList.remove('show');
        }
    };
    reader.readAsText(file);
});

// 分析数据
function analyzeData() {
    const msgs = rawData.messages || [];
    const session = rawData.session || {};
    
    // 获取两个人的名字
    const senders = {};
    msgs.forEach(m => {
        const name = m.senderDisplayName || m.senderUsername;
        if (!senders[name]) senders[name] = { count: 0, isSend: m.isSend };
        senders[name].count++;
    });
    
    const names = Object.keys(senders);
    stats = { users: [] };
    
    names.forEach(name => {
        stats.users.push({
            name: name,
            isSend: senders[name].isSend,
            count: senders[name].count
        });
    });
}

// 显示视角选择
function showPerspective() {
    document.getElementById('loading').classList.remove('show');
    uploadEl.classList.add('hide');
    perspectiveEl.classList.add('show');
    
    const options = document.getElementById('perspectiveOptions');
    options.innerHTML = '';
    
    stats.users.forEach((u, i) => {
        const div = document.createElement('div');
        div.className = 'opt ' + (i === 0 ? 'me' : 'them');
        div.innerHTML = '<div class="name">' + u.name + '</div><div class="count">' + u.count + ' 条消息</div>';
        div.onclick = function() { selectPerspective(u.name); };
        options.appendChild(div);
    });
}

// 选择视角
function selectPerspective(name) {
    myName = name;
    themName = stats.users.find(u => u.name !== name).name;
    
    perspectiveEl.classList.remove('show');
    
    // 完整分析
    fullAnalyze();
    
    // 显示intro
    const year = new Date().getFullYear();
    document.getElementById('introYear').textContent = year;
    document.getElementById('introMe').textContent = myName;
    document.getElementById('introThem').textContent = themName;
    introEl.classList.add('show');
}

// 完整分析
function fullAnalyze() {
    const msgs = rawData.messages || [];
    
    // 基础统计
    let myMsgs = 0, themMsgs = 0, myChars = 0, themChars = 0;
    let myQuestions = 0, themQuestions = 0;
    let hours = {};
    let weekdays = {};
    let months = {};
    let dates = new Set();
    let textMsgs = [];
    let sessions = 0;
    let lastTime = 0;
    
    // 高频词
    const wordCount = {};
    const myEmojis = {};
    const themEmojis = {};
    
    msgs.forEach(m => {
        const sender = m.senderDisplayName || m.senderUsername;
        const isMe = sender === myName;
        const content = m.content || '';
        const time = m.createTime * 1000;
        const date = new Date(time);
        
        // 计数
        if (isMe) { myMsgs++; myChars += content.length; }
        else { themMsgs++; themChars += content.length; }
        
        // 疑问句
        if (content.includes('?') || content.includes('？') || content.includes('吗') || content.includes('呢')) {
            if (isMe) myQuestions++; else themQuestions++;
        }
        
        // 时间分布
        const h = date.getHours();
        const w = date.getDay();
        const mon = date.getMonth() + 1;
        hours[h] = (hours[h] || 0) + 1;
        weekdays[w] = (weekdays[w] || 0) + 1;
        months[mon] = (months[mon] || 0) + 1;
        dates.add(date.toDateString());
        
        // 会话计数（超过2小时算新会话）
        if (time - lastTime > 2 * 60 * 60 * 1000) sessions++;
        lastTime = time;
        
        // 文本消息收集
        if (m.type === '文本消息' && content.length > 1 && content.length < 50) {
            textMsgs.push({ c: content, m: isMe, t: m.formattedTime?.split(' ')[0] || '' });
        }
        
        // emoji统计
        const emojiRegex = /[\u{1F300}-\u{1F9FF}]|[\u{2600}-\u{26FF}]|\[[\u4e00-\u9fa5]+\]/gu;
        const emojis = content.match(emojiRegex) || [];
        emojis.forEach(e => {
            if (isMe) myEmojis[e] = (myEmojis[e] || 0) + 1;
            else themEmojis[e] = (themEmojis[e] || 0) + 1;
        });
        
        // 词频（简单分词）
        if (m.type === '文本消息') {
            const words = content.match(/[\u4e00-\u9fa5]{2,4}|[a-zA-Z]{3,}/g) || [];
            words.forEach(w => { wordCount[w] = (wordCount[w] || 0) + 1; });
        }
    });
    
    // 峰值小时
    let peakHour = 0, peakCount = 0;
    Object.keys(hours).forEach(h => {
        if (hours[h] > peakCount) { peakCount = hours[h]; peakHour = h; }
    });
    
    // 峰值星期
    const weekNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
    let peakWeekday = 0, peakWCount = 0;
    Object.keys(weekdays).forEach(w => {
        if (weekdays[w] > peakWCount) { peakWCount = weekdays[w]; peakWeekday = w; }
    });
    
    // 高频词top10
    const topWords = Object.entries(wordCount)
        .filter(([w]) => w.length >= 2 && !['哈哈', '嗯嗯', '好的', '什么', '可以', '没有', '不是', '这个', '那个', '就是'].includes(w))
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);
    
    // 最常用emoji
    const myTopEmoji = Object.entries(myEmojis).sort((a, b) => b[1] - a[1])[0];
    const themTopEmoji = Object.entries(themEmojis).sort((a, b) => b[1] - a[1])[0];
    
    // 采样动画消息
    const sampleSize = Math.min(300, textMsgs.length);
    const step = textMsgs.length / sampleSize;
    animMsgs = [];
    for (let i = 0; i < sampleSize; i++) {
        animMsgs.push(textMsgs[Math.floor(i * step)]);
    }
    
    // 保存统计
    stats = {
        ...stats,
        totalMsgs: myMsgs + themMsgs,
        myMsgs, themMsgs,
        myChars, themChars,
        totalChars: myChars + themChars,
        myAvgLen: myMsgs > 0 ? (myChars / myMsgs).toFixed(1) : 0,
        themAvgLen: themMsgs > 0 ? (themChars / themMsgs).toFixed(1) : 0,
        sessions,
        days: dates.size,
        peakHour,
        peakWeekday: weekNames[peakWeekday],
        myQuestionPct: myMsgs > 0 ? ((myQuestions / myMsgs) * 100).toFixed(1) : 0,
        themQuestionPct: themMsgs > 0 ? ((themQuestions / themMsgs) * 100).toFixed(1) : 0,
        topWords,
        myTopEmoji: myTopEmoji ? myTopEmoji[0] : '😊',
        themTopEmoji: themTopEmoji ? themTopEmoji[0] : '😂',
        myMsgPct: Math.round((myMsgs / (myMsgs + themMsgs)) * 100),
        themMsgPct: Math.round((themMsgs / (myMsgs + themMsgs)) * 100),
        myCharPct: Math.round((myChars / (myChars + themChars)) * 100),
        themCharPct: Math.round((themChars / (myChars + themChars)) * 100)
    };
    
    // 生成报告HTML
    generateReport();
}

// 生成报告
function generateReport() {
    const s = stats;
    const year = new Date().getFullYear();
    
    pgwrap.innerHTML = `
    <div class="pg" data-p="1" style="top:0">
        <div class="phd"><div class="pn">01 / OVERVIEW</div><div class="pt">这一年，我们聊了</div></div>
        <div class="hero"><div class="n" data-count="${s.totalMsgs}">0</div><div class="l">条消息</div></div>
        <div class="grid">
            <div class="card me-bg"><div class="v" data-count="${s.myMsgs}">0</div><div class="l">我发送</div></div>
            <div class="card them-bg"><div class="v" data-count="${s.themMsgs}">0</div><div class="l">TA发送</div></div>
            <div class="card"><div class="v g" data-count="${s.sessions}">0</div><div class="l">次会话</div></div>
            <div class="card"><div class="v g" data-count="${s.days}">0</div><div class="l">天</div></div>
        </div>
        <div class="insight"><div class="insight-title">💬 消息比例</div><div class="insight-text">我发送了${s.myMsgPct}%的消息，TA发送了${s.themMsgPct}%。${s.myMsgPct > s.themMsgPct ? '我更主动一些' : 'TA更主动一些'}。</div></div>
    </div>
    
    <div class="pg" data-p="2" style="top:100%">
        <div class="phd"><div class="pn">02 / WORDS</div><div class="pt">我们写下的字</div></div>
        <div class="hero"><div class="n" data-count="${s.totalChars}">0</div><div class="l">总字数</div></div>
        <div class="grid">
            <div class="card me-bg"><div class="v" data-count="${s.myChars}">0</div><div class="l">我写的字</div></div>
            <div class="card them-bg"><div class="v" data-count="${s.themChars}">0</div><div class="l">TA写的字</div></div>
        </div>
        <div class="bar-row"><div class="bar-label">我</div><div class="bar-wrap"><div class="bar-fill me" data-pct="${s.myCharPct}" style="width:0">${s.myCharPct}%</div></div></div>
        <div class="bar-row"><div class="bar-label">TA</div><div class="bar-wrap"><div class="bar-fill them" data-pct="${s.themCharPct}" style="width:0">${s.themCharPct}%</div></div></div>
        <div class="insight"><div class="insight-title">✍️ 平均长度</div><div class="insight-text">我平均每条${s.myAvgLen}字，TA平均${s.themAvgLen}字。${parseFloat(s.myAvgLen) > parseFloat(s.themAvgLen) ? '我更喜欢写长句' : 'TA更喜欢写长句'}。</div></div>
    </div>
    
    <div class="pg" data-p="3" style="top:200%">
        <div class="phd"><div class="pn">03 / TIME</div><div class="pt">我们的聊天时间</div></div>
        <div class="grid">
            <div class="card"><div class="v me">${s.peakHour}:00</div><div class="l">聊天高峰</div></div>
            <div class="card"><div class="v them">${s.peakWeekday}</div><div class="l">最活跃</div></div>
            <div class="card"><div class="v g" data-count="${s.myQuestionPct}">0</div><div class="l">% 我用疑问句</div></div>
            <div class="card"><div class="v g" data-count="${s.themQuestionPct}">0</div><div class="l">% TA用疑问句</div></div>
        </div>
        <div class="insight"><div class="insight-title">⏰ 时间规律</div><div class="insight-text">${s.peakHour}点是我们聊天的高峰时段，${s.peakWeekday}是我们最活跃的一天。</div></div>
    </div>
    
    <div class="pg" data-p="4" style="top:300%">
        <div class="phd"><div class="pn">04 / EMOJI</div><div class="pt">表情的秘密</div></div>
        <div class="grid">
            <div class="card me-bg"><div class="v">${s.myTopEmoji}</div><div class="l">我最爱用</div></div>
            <div class="card them-bg"><div class="v">${s.themTopEmoji}</div><div class="l">TA最爱用</div></div>
        </div>
        <div class="insight"><div class="insight-title">🎭 表情风格</div><div class="insight-text">我们用不同的方式表达情绪，这就是我们独特的交流方式。</div></div>
    </div>
    
    <div class="pg" data-p="5" style="top:400%">
        <div class="phd"><div class="pn">05 / KEYWORDS</div><div class="pt">我们常说的词</div></div>
        ${s.topWords.slice(0, 5).map((w, i) => `
        <div class="bar-row"><div class="bar-label">${w[0]}</div><div class="bar-wrap"><div class="bar-fill ${i % 2 === 0 ? 'me' : 'them'}" data-pct="${Math.round(w[1] / s.topWords[0][1] * 100)}" style="width:0">${w[1]}次</div></div></div>
        `).join('')}
        <div class="insight"><div class="insight-title">💬 高频话题</div><div class="insight-text">"${s.topWords[0]?.[0] || '聊天'}"是我们提到最多的词，出现了${s.topWords[0]?.[1] || 0}次。</div></div>
    </div>
    
    <div class="pg" data-p="6" style="top:500%">
        <div class="end">
            <div class="ti">${year}<br>${myName} → ${themName}</div>
            <div class="st">${s.totalMsgs.toLocaleString()} 条消息 · ${s.totalChars.toLocaleString()} 字 · ${s.days} 天</div>
            <div class="msg">感谢这一年的陪伴 💜</div>
        </div>
    </div>
    `;
    
    // 初始化分页
    pgs = document.querySelectorAll('.pg');
    total = pgs.length;
    dotsEl.innerHTML = '';
    for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'dot' + (i === 0 ? ' act' : '');
        d.onclick = function() { goPage(i + 1); };
        dotsEl.appendChild(d);
    }
    dots = dotsEl.querySelectorAll('.dot');
}

// 音乐控制
function toggleMute() {
    if (bgm.paused) {
        bgm.volume = 0.3;
        bgm.play().catch(function(){});
        isMuted = false;
    } else {
        isMuted = !isMuted;
    }
    bgm.muted = isMuted;
    muteBtn.textContent = isMuted ? '🔇' : '🔊';
}

// 开始动画
function startAnim() {
    introEl.classList.add('hide');
    muteBtn.classList.add('show');
    bgm.volume = 0.3;
    bgm.play().catch(function(){});
    setTimeout(function() {
        animEl.classList.add('on');
        runAnim();
    }, 600);
}

// 运行动画
function runAnim() {
    let i = 0;
    const n = animMsgs.length;
    const dur = 20000;
    const t0 = Date.now();
    const centerN = Math.min(6, Math.floor(n * 0.04));
    let lastCenter = null;
    
    function next() {
        if (i >= n) {
            setTimeout(function() {
                ac.querySelectorAll('.fmsg').forEach(function(el) {
                    el.style.transition = 'opacity 2s ease, filter 1.5s ease';
                    el.style.opacity = '0';
                    el.style.filter = 'blur(6px)';
                });
            }, 400);
            setTimeout(function() {
                animEl.classList.add('out');
                setTimeout(function() {
                    animEl.style.display = 'none';
                    reportEl.classList.add('on');
                    goPage(1);
                }, 1300);
            }, 2200);
            return;
        }
        
        const elapsed = Date.now() - t0;
        const p = Math.min(elapsed / dur, 1);
        prog.style.width = (p * 100) + '%';
        const m = animMsgs[i];
        
        if (i < centerN) {
            if (lastCenter) {
                lastCenter.classList.remove('show');
                lastCenter.classList.add('hide');
            }
            const div = document.createElement('div');
            div.className = 'cmsg ' + (m.m ? 'me' : 'them') + ' show';
            const sz = 36 - i * 2;
            div.innerHTML = '<div class="dt">' + m.t + '</div><div class="txt" style="font-size:' + sz + 'px">' + m.c + '</div>';
            ac.appendChild(div);
            lastCenter = div;
        } else {
            if (lastCenter && i === centerN) {
                lastCenter.classList.add('hide');
                setTimeout(function() { if (lastCenter) lastCenter.remove(); }, 800);
                lastCenter = null;
            }
            const div = document.createElement('div');
            div.className = 'fmsg ' + (m.m ? 'me' : 'them') + ' show';
            const phase = (i - centerN) / (n - centerN);
            const sz = 13 + phase * 14 + Math.random() * 5;
            div.textContent = m.c.substring(0, 25);
            div.style.fontSize = sz + 'px';
            div.style.left = (2 + Math.random() * 96) + '%';
            div.style.top = (2 + Math.random() * 96) + '%';
            ac.appendChild(div);
            
            if (i < n - 25) {
                const fadeDelay = 1.5 + phase * 3.5;
                const fadeDur = 1.5 + phase * 2;
                setTimeout(function() {
                    div.style.transition = 'opacity ' + fadeDur + 's ease, filter ' + fadeDur + 's ease';
                    div.style.opacity = '0';
                    div.style.filter = 'blur(4px)';
                }, fadeDelay * 1000);
            }
        }
        
        i++;
        let delay;
        if (i <= centerN) delay = 700;
        else {
            const phase = (i - centerN) / (n - centerN);
            if (phase < 0.15) delay = 350 - phase * 1200;
            else if (phase < 0.4) delay = 180 - phase * 250;
            else delay = Math.max(10, 100 * Math.pow(1 - phase, 2.5));
        }
        setTimeout(next, delay);
    }
    next();
}

// 翻页
function goPage(n) {
    if (n < 1 || n > total || busy) return;
    busy = true;
    cur = n;
    pgwrap.style.transform = 'translateY(-' + ((n - 1) * 100) + '%)';
    dots.forEach(function(d, i) { d.classList.toggle('act', i === n - 1); });
    const pg = document.querySelector('.pg[data-p="' + n + '"]');
    pg.scrollTop = 0;
    readyToFlip = false;
    hint.classList.remove('ready');
    hint.textContent = '滚动翻页 ↓';
    setTimeout(function() { busy = false; animatePage(n); }, 500);
}

// 页面动画
function animatePage(n) {
    const pg = document.querySelector('.pg[data-p="' + n + '"]');
    let delay = 0;
    pg.querySelectorAll('.phd,.hero,.card,.bar-row,.insight,.quote,.end .ti,.end .st,.end .msg').forEach(function(el) {
        setTimeout(function() { el.classList.add('ani'); }, delay);
        delay += 80;
    });
    pg.querySelectorAll('[data-count]').forEach(function(el) {
        const target = parseFloat(el.dataset.count);
        animateNumber(el, target, 1200);
    });
    pg.querySelectorAll('.bar-fill[data-pct]').forEach(function(el) {
        const pct = el.dataset.pct;
        setTimeout(function() { el.style.width = pct + '%'; }, 300);
    });
}

// 数字动画
function animateNumber(el, target, duration) {
    const startTime = Date.now();
    const isFloat = target % 1 !== 0;
    function update() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const current = target * eased;
        el.textContent = isFloat ? current.toFixed(1) : Math.floor(current).toLocaleString();
        if (progress < 1) requestAnimationFrame(update);
        else el.textContent = isFloat ? target.toFixed(1) : target.toLocaleString();
    }
    update();
}

// 滚轮事件
document.addEventListener('wheel', function(e) {
    if (!reportEl.classList.contains('on') || busy) return;
    const pg = document.querySelector('.pg[data-p="' + cur + '"]');
    const atTop = pg.scrollTop <= 0;
    const atBottom = pg.scrollTop + pg.clientHeight >= pg.scrollHeight - 5;
    
    if (e.deltaY > 0) {
        if (atBottom) {
            if (readyToFlip) { if (cur < total) goPage(cur + 1); }
            else { readyToFlip = true; hint.classList.add('ready'); hint.textContent = '再滚一下翻页 ↓'; }
        } else { readyToFlip = false; hint.classList.remove('ready'); hint.textContent = '滚动翻页 ↓'; }
    } else {
        if (atTop) {
            if (readyToFlip) { if (cur > 1) goPage(cur - 1); }
            else { readyToFlip = true; hint.classList.add('ready'); hint.textContent = '再滚一下翻页 ↑'; }
        } else { readyToFlip = false; hint.classList.remove('ready'); hint.textContent = '滚动翻页 ↓'; }
    }
}, { passive: true });

// 重置翻页状态
let resetT;
document.addEventListener('wheel', function() {
    clearTimeout(resetT);
    resetT = setTimeout(function() { readyToFlip = false; hint.classList.remove('ready'); hint.textContent = '滚动翻页 ↓'; }, 1500);
}, { passive: true });

// 键盘事件
document.addEventListener('keydown', function(e) {
    if (!reportEl.classList.contains('on')) return;
    if (['ArrowDown', ' ', 'Enter'].indexOf(e.key) >= 0 && cur < total) goPage(cur + 1);
    else if (e.key === 'ArrowUp' && cur > 1) goPage(cur - 1);
});

// 触摸事件
let ty = 0;
document.addEventListener('touchstart', function(e) { ty = e.touches[0].clientY; }, { passive: true });
document.addEventListener('touchend', function(e) {
    if (!reportEl.classList.contains('on')) return;
    const d = ty - e.changedTouches[0].clientY;
    if (Math.abs(d) > 50) {
        if (d > 0 && cur < total) goPage(cur + 1);
        else if (d < 0 && cur > 1) goPage(cur - 1);
    }
}, { passive: true });
</script>
</body>
